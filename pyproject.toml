[project]
name = "penpine"
version = "0.0.1"
description = "A layered Python pentesting framework — L0 HTTP message core"
requires-python = ">=3.11"
dependencies = ["jsonpath-ng>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
penpine = "penpine.cli.main:main"

[tool.setuptools.package-data]
"penpine.cli" = ["templates/**/*", "templates/**/.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: end-to-end tests that build a real virtualenv (opt-in)"]
