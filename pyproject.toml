[project]
name = "penpine"
version = "0.3.3"
description = "A layered Python pentesting framework"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nquangit", email = "huynhngocq5@gmail.com" }]
keywords = ["pentesting", "security", "http", "fuzzing", "web-security"]
requires-python = ">=3.11"
dependencies = ["jsonpath-ng>=1.6", "rich>=13"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0", "pre-commit>=3.7"]

[project.scripts]
penpine = "penpine.cli.main:main"

[project.urls]
Homepage = "https://git.nquangit.io.vn/nquangit/pypenpine"
Repository = "https://git.nquangit.io.vn/nquangit/pypenpine"

[tool.setuptools.package-data]
"penpine" = ["py.typed"]
"penpine.cli" = ["templates/**/*", "templates/**/.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["penpine/cli/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["penpine"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["penpine"]
branch = true

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: end-to-end tests that build a real virtualenv (opt-in)"]
